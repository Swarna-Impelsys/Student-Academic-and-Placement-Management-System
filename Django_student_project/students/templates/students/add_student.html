<!DOCTYPE html>
<html>
    <head>
        <title >Add Student</title>
    </head>
    <body>
        <h1>Add student</h1>
        <form method="POST"> 

            {%csrf_token%}

            <input
            type='text'
            name='name'
            placeholder='Name'>
            <br><br>

            <input
            type='number'
            name='Age'
            Placeholder='Age'>
            <br><br>

            <input
            type='email'
            name='Email'
            placeholder='Email'>
            <br><br> 

            <input
            type='number'
            name='Phone'
            Placeholder='Phone'>
            <br><br>

            <input
            type='text'
            name="course"
            placeholder='Course'>
            <br><br>

            
            <button type='submit'>Add student</button>
        </form>
    </body>
</html>
