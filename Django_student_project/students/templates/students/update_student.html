<!DOCTYPE html>
<html>
    <head>
    <title>Update Student </title>
    </head>

    <body>

        <h1>Update Student</h1>
        {%csrf_token%}
        <form method='POST'>
            {%csrf_token%}
            

            <input
            type='text'
            name='name'
            Placeholder='Name'
            value='{{student.name}}'>
            <br><br>

            <input
            type='number'
            name='Age'
            placeholder='Age'
            value='{{student.age}}'>
            <br><br>

            <input
            type='email'
            name='Email'
            placeholder='Email'
            value='{{student.email}}'>
            <br><br>

            <input
            type='number'
            name='Phone'
            placeholder='Phone'
            value='{{student.phone}}'>
            <br><br>

            <input
            type='text'
            name='course'
            placeholder='Course'
            value='{{student.course}}'>
            <br><br>

            <button type='submit'>Update Student</button>

        </form>
    </body>
    
</html>
