<!DOCTYPE html>
<html>
<head>
    <title>Course Students</title>
</head>
<body>

    <h1>{{ course.name }}</h1>

    <h2>Students in this Course</h2>

    {% for student in students %}

        <p>Name: {{ student.name }}</p>
        <p>Age: {{ student.Age }}</p>
        <p>Email: {{ student.Email }}</p>
        <p>Phone: {{ student.Phone }}</p>

        <hr>

    {% empty %}

        <p>No students found.</p>

    {% endfor %}

</body>
</html>
